<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join me on Gym Rat</title>
<meta name="description" content="You're invited to lift with friends on Gym Rat, a voice coach in your ear.">
<meta name="robots" content="noindex">
<!-- The card this link shows in a text. -->
<meta property="og:site_name" content="Gym Rat">
<meta property="og:title" content="Lift with me on Gym Rat">
<meta property="og:description" content="You're invited. A voice coach in your ear: log every set by voice and lift with your friends.">
<meta property="og:image" content="https://gymrat.bensealey.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Gym Rat: a voice coach in your ear.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
  :root { --bg: #0b0b0c; --card: #161618; --card2: #1d1d20; --line: #2a2a2e; --text: #f2f2f2; --muted: #9a9aa0; --green: #34c759; --orange: #ff9f0a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 28px 16px 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; margin-bottom: 22px; }
  .brand svg { width: 30px; height: 30px; }
  h1 { font-size: 27px; line-height: 1.2; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .note { background: rgba(255,159,10,.12); color: var(--orange); border-radius: 12px; padding: 10px 14px; font-size: 15px; margin: 14px 0 22px; }
  .step { background: var(--card); border-radius: 16px; padding: 16px; margin-top: 12px; }
  .step h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .btn { display: block; width: 100%; text-align: center; background: var(--green); color: #000; border: 0; border-radius: 12px; padding: 14px;
         font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
  .code { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card2); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .code b { font-size: 30px; letter-spacing: .14em; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .copy { background: var(--line); color: var(--text); border: 0; border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; min-width: 84px; }
  .small { font-size: 14px; }
  .center { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
</style>
</head>
<body>
<main id="app"><div class="center"><p class="muted">Loading…</p></div></main>
<script>
// The join page: someone in a Gym Rat group sent this link (join.html?i=<key>). It shows who invited them, the
// TestFlight link, and the code with a Copy button, and says up front that a group sees your workouts. Read-only; the
// code is used in the app, never here.
const FN = "https://yuxiocfpkkfrkuyowfvz.supabase.co/functions/v1/gym-rat";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1eGlvY2Zwa2tmcmt1eW93ZnZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMDIyMjksImV4cCI6MjEwNjc3ODIyOX0.5QWpS6X_J-31Ixnp4PsqjSdqQ1RbkpYSu1HASf3Rohw";
const TESTFLIGHT = "https://testflight.apple.com/join/8HKKAKzn";
const LOGO = '<svg viewBox="0 0 24 24" fill="#34c759"><rect x="1" y="9" width="2.6" height="6" rx="1.3"/><rect x="4.4" y="6.5" width="3.4" height="11" rx="1.7"/><rect x="7.8" y="10.8" width="8.4" height="2.4"/><rect x="16.2" y="6.5" width="3.4" height="11" rx="1.7"/><rect x="20.4" y="9" width="2.6" height="6" rx="1.3"/></svg>';
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const longDay = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });

async function call(body) {
  const res = await fetch(FN, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + KEY, apikey: KEY },
    body: JSON.stringify(body),
    keepalive: true,
  });
  return res.json().catch(() => ({ error: "server" }));
}

// What the page shows for an invite (or for none: null is a link that isn't valid, "offline" one that couldn't load).
function joinHtml(invite) {
  const head = `<div class="brand">${LOGO}<span>Gym Rat</span></div>`;
  const from = esc(invite && invite.from ? invite.from : "whoever sent it");
  if (invite === "offline") return `${head}<div class="center"><h1>Couldn't load your invite</h1><p class="muted">Check your connection and refresh the page.</p></div>`;
  if (!invite) return `${head}<div class="center"><h1>This invite link isn't valid</h1><p class="muted">Ask whoever sent it for a new one.</p></div>`;
  if (invite.state === "used") return `${head}<div class="center"><h1>This invite has been used</h1><p class="muted">Each invite works once. Ask ${from} for a new one.</p></div>`;
  if (invite.state !== "ok" || !invite.code) return `${head}<div class="center"><h1>This invite has expired</h1><p class="muted">Invites last two weeks. Ask ${from} for a new one.</p></div>`;
  const others = Number(invite.members) || 0;
  return `${head}
    <h1>${from} invited you to lift on Gym Rat</h1>
    <p class="muted" style="margin:0">Join ${esc(invite.group)}${others > 1 ? `, ${others} lifting together` : ""}. Gym Rat is a coach in your ear that logs every set by voice.</p>
    <div class="note">Joining a group shows your workouts to everyone in it.</div>
    <div class="step"><h2>1. Get the app</h2>
      <a class="btn" id="tf" href="${TESTFLIGHT}">Get Gym Rat on TestFlight</a>
      <p class="muted small" style="margin:10px 0 0">On your iPhone. If it asks you to install TestFlight first, do that, then tap this button again.</p></div>
    <div class="step"><h2>2. Enter your code</h2>
      <div class="muted small">Open Gym Rat, sign in with Apple, and enter:</div>
      <div class="code"><b id="code">${esc(invite.code)}</b><button class="copy" id="copy">Copy</button></div>
      <p class="muted small" style="margin:10px 0 0">It works once${invite.expires_on ? `, until ${esc(longDay(invite.expires_on))}` : ""}. Already on Gym Rat? Settings, then Groups, then Join with a code.</p></div>`;
}

async function copyCode(code, button) {
  try {
    await navigator.clipboard.writeText(code);
  } catch {
    // Older browsers: select it so a long press copies it.
    const range = document.createRange();
    range.selectNodeContents(document.getElementById("code"));
    getSelection().removeAllRanges();
    getSelection().addRange(range);
  }
  button.textContent = "Copied";
  setTimeout(() => (button.textContent = "Copy"), 2000);
  call({ action: "web_count", kind: "join_copy" }).catch(() => {});
}

async function load() {
  const params = new URLSearchParams(location.search);
  const key = (params.get("i") || "").trim().toLowerCase();
  let invite = null;
  if (params.has("demo")) {
    // Local preview only, no server: ?demo=ok (or used, expired, bad).
    const state = params.get("demo") || "ok";
    invite = state === "bad" ? null : { state, from: "Ben", group: "Sealey Gym Rats", members: 3, code: state === "ok" ? "V7KQ2M" : null, expires_on: "2026-11-23" };
  } else if (/^[a-f0-9]{32}$/.test(key)) {
    const out = await call({ action: "web_invite", key }).catch(() => ({ error: "offline" }));
    invite = out.ok ? out.invite : out.error === "not_found" ? null : "offline";
  }
  document.getElementById("app").innerHTML = joinHtml(invite);
  const copy = document.getElementById("copy");
  if (copy) copy.onclick = () => copyCode(invite.code, copy);
  const tf = document.getElementById("tf");
  if (tf) tf.addEventListener("click", () => { call({ action: "web_count", kind: "join_testflight" }).catch(() => {}); });
}
load();
</script>
</body>
</html>
